<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Archivo';font-weight:500 900;font-stretch:100% 125%;src:url(static/fonts/archivo-var.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400 600;src:url(static/fonts/plexsans-var.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(static/fonts/plexmono-500.woff2) format('woff2')}
html,body{margin:0;width:1200px;height:630px;background:#0b0f14;color:#f4f6f8;overflow:hidden}
.wrap{padding:88px 96px;display:flex;flex-direction:column;justify-content:space-between;height:630px;box-sizing:border-box}
.mark{font-family:Archivo;font-variation-settings:"wdth" 112;font-weight:800;font-size:112px;letter-spacing:-.04em;line-height:1;display:flex;align-items:center}
.mark .o{color:#2ee6a6}.mark .bar{display:inline-block;width:16px;height:90px;background:#2ee6a6;margin-left:8px}
.eyebrow{font-family:'IBM Plex Mono';font-weight:500;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#2ee6a6;margin-top:36px}
h2{font-family:Archivo;font-variation-settings:"wdth" 108;font-weight:800;font-size:64px;letter-spacing:-.025em;line-height:1.05;margin:16px 0 0;max-width:22ch}
.foot{font-family:'IBM Plex Sans';font-size:26px;color:#aab4bf}
</style></head><body><div class="wrap">
<div><div class="mark"><span class="o">Ops</span><span>Automated</span><span class="bar"></span></div>
<div class="eyebrow">AI agents for recruitment agencies</div>
<h2>More placements without adding payroll.</h2></div>
<div class="foot">opsautomated.co.uk</div>
</div></body></html>
