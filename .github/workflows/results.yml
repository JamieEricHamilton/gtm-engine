name: Refresh RESULTS.md

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull aggregates from the database
        # Publishable (anon) key only. anon can execute intel_results() and nothing else; it has no
        # table grants and RLS is enabled with no policies (supabase/migrations/0004_results_access.sql).
        # No privileged key is held in this repository's Actions secrets.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RESULTS_RPC: ${{ vars.RESULTS_RPC || 'intel_results' }}
        run: |
          set -euo pipefail
          [[ "$RESULTS_RPC" =~ ^[a-z_]+$ ]] || { echo "bad RESULTS_RPC"; exit 1; }
          curl -sS -f -X POST "$SUPABASE_URL/rest/v1/rpc/$RESULTS_RPC" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" -d '{}' > results/latest.json
          python3 -c 'import json; json.load(open("results/latest.json"))'

      - name: Render
        run: python3 tools/render_results.py results/latest.json > RESULTS.md

      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add results/latest.json RESULTS.md
          git diff --cached --quiet && echo "no change" || git commit -m "results: weekly refresh" && git push
