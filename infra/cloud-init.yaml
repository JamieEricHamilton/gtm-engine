#cloud-config
# OpsAutomated n8n-1 - first-boot setup
# n8n + Postgres + Caddy (auto HTTPS) via Docker Compose, firewall, nightly DB backup.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades, jq]
timezone: Europe/London

write_files:
  - path: /opt/n8n/docker-compose.yml
    permissions: "0644"
    content: |
      services:
        postgres:
          image: postgres:16-alpine
          restart: unless-stopped
          environment:
            POSTGRES_USER: n8n
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: n8n
          volumes:
            - postgres_data:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
            interval: 10s
            timeout: 5s
            retries: 10

        n8n:
          image: docker.n8n.io/n8nio/n8n:latest
          restart: unless-stopped
          depends_on:
            postgres:
              condition: service_healthy
          environment:
            N8N_HOST: ${N8N_HOST}
            N8N_PORT: 5678
            N8N_PROTOCOL: https
            N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
            WEBHOOK_URL: https://${WEBHOOK_HOST}/
            N8N_PROXY_HOPS: 1
            N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
            DB_TYPE: postgresdb
            DB_POSTGRESDB_HOST: postgres
            DB_POSTGRESDB_PORT: 5432
            DB_POSTGRESDB_DATABASE: n8n
            DB_POSTGRESDB_USER: n8n
            DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
            GENERIC_TIMEZONE: Europe/London
            TZ: Europe/London
            N8N_RUNNERS_ENABLED: "true"
            N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
            EXECUTIONS_DATA_PRUNE: "true"
            EXECUTIONS_DATA_MAX_AGE: 720
            N8N_DIAGNOSTICS_ENABLED: "false"
            N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
            N8N_TEMPLATES_ENABLED: "false"
            N8N_HIRING_BANNER_ENABLED: "false"
            N8N_PERSONALIZATION_ENABLED: "false"
          volumes:
            - n8n_data:/home/node/.n8n
            - /opt/n8n/files:/files

        caddy:
          image: caddy:2-alpine
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - /opt/n8n/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config

      volumes:
        postgres_data:
        n8n_data:
        caddy_data:
        caddy_config:

  - path: /opt/n8n/Caddyfile
    permissions: "0644"
    content: |
      {
        email ops@example.com
      }

      n8n.example.com {
        reverse_proxy n8n:5678
        encode gzip
      }

      hooks.example.com {
        # only webhook paths are exposed on the public hostname
        @hooks path /webhook/* /webhook-test/* /webhook-waiting/* /form/* /form-test/* /form-waiting/* /mcp/* /rest/oauth2-credential/callback /healthz
        handle @hooks {
          reverse_proxy n8n:5678
        }
        handle {
          respond "OpsAutomated" 404
        }
      }

  - path: /opt/n8n/backup.sh
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      # Nightly: dump Postgres + copy n8n data dir. Keeps 14 days locally.
      set -euo pipefail
      cd /opt/n8n
      ts=$(date +%Y%m%d-%H%M)
      mkdir -p /opt/backups
      docker compose exec -T postgres pg_dump -U n8n -d n8n | gzip > /opt/backups/n8n-db-$ts.sql.gz
      docker run --rm -v n8n_n8n_data:/src:ro -v /opt/backups:/dst alpine tar czf /dst/n8n-data-$ts.tgz -C /src .
      find /opt/backups -type f -mtime +14 -delete
      echo "backup ok $ts"

  - path: /etc/cron.d/n8n-backup
    permissions: "0644"
    content: |
      15 2 * * * root /opt/n8n/backup.sh >> /var/log/n8n-backup.log 2>&1

  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  # docker
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  # secrets (generated once, never leave the box except to 1Password)
  - mkdir -p /opt/n8n/files
  - |
    if [ ! -f /opt/n8n/.env ]; then
      umask 077
      cat > /opt/n8n/.env <<EOF
    N8N_HOST=n8n.example.com
    WEBHOOK_HOST=hooks.example.com
    DB_PASSWORD=$(openssl rand -hex 24)
    N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)
    EOF
    fi
  - chown -R 1000:1000 /opt/n8n/files
  - cd /opt/n8n && docker compose pull && docker compose up -d
  - touch /opt/n8n/.cloud-init-done
